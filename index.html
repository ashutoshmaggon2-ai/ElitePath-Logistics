<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elite Path Logistics</title>
    <link rel="canonical" href="https://elitepathlogistics.in/">
    <style>
      :root{--gold:#f2b705;--green-dark:#0e3a25}
      html,body{height:100%;margin:0}
      body{display:flex;align-items:center;justify-content:center;background:#ffffff;font-family:Arial,Helvetica,sans-serif}
      .logo-plate{background:#ffffff;border:8px solid var(--gold);padding:28px;border-radius:8px;box-shadow:0 14px 40px rgba(14,58,37,0.08);text-align:center;max-width:900px;width:92%}
      .logo-plate img{max-width:100%;height:auto;display:block;margin:0 auto}
      .cta{margin-top:22px;display:flex;gap:12px;justify-content:center}
      .btn{background:var(--gold);color:var(--green-dark);padding:10px 18px;border-radius:6px;text-decoration:none;font-weight:700}
      .btn.secondary{background:transparent;border:2px solid var(--green-dark);color:var(--green-dark)}
      .caption{margin-top:14px;color:#2b4b3b;font-size:0.95rem}
    </style>
  </head>
  <body>
    <div class="logo-plate" role="main">
      <!-- Replace the src below with the uploaded logo filename if different -->
      <img src="elite-path-logo-no-white.png" alt="Elite Path Logistics logo">
      <div class="cta">
        <a class="btn" href="elite_path_logistics_updated.html">Enter site</a>
        <a class="btn secondary" href="#" onclick="location.reload()">Reload</a>
      </div>
      <div class="caption">If the logo does not appear, make sure the file <code>elite-path-logo-no-white.png</code> is present at the repository root.</div>
    </div>
  </body>
</html>
